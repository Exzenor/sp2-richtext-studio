<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SP2 RichText Studio — Exzenor</title>
<style>
  :root {
    --bg: #12141a;
    --panel: rgba(30, 34, 43, 0.88);
    --panel-solid: #1e222b;
    --border: rgba(255, 255, 255, 0.09);
    --text: #e6eaf2;
    --muted: #98a2b3;
    --input-bg: rgba(16, 18, 24, 0.85);
    --input-border: #3a4152;
    --out-bg: #0f1116;
    --out-text: #7dff9b;
    --accent: #2b7de9;
    --title: #6ec1ff;
    --sec-bg: #323846;
    --sec-hover: #424a5c;
    --ok-bg: rgba(22, 51, 34, 0.9); --ok-bd: #2a7a4b; --ok-tx: #9cf5be;
    --warn-bg: rgba(56, 35, 21, 0.9); --warn-bd: #a85a24; --warn-tx: #ffd0a6;
    --crit-bg: rgba(61, 20, 25, 0.9); --crit-bd: #b82838; --crit-tx: #ffb3ba;
    --wm-opacity: 0.09;
  }
  body.light {
    --bg: #e9edf4;
    --panel: rgba(255, 255, 255, 0.88);
    --panel-solid: #ffffff;
    --border: rgba(20, 30, 50, 0.12);
    --text: #1b222c;
    --muted: #5a6577;
    --input-bg: rgba(244, 246, 250, 0.92);
    --input-border: #c5cedb;
    --out-bg: #f4f6f9;
    --out-text: #0f6b36;
    --title: #175fc2;
    --sec-bg: #e1e6ef;
    --sec-hover: #cfd7e4;
    --ok-bg: rgba(230, 246, 236, 0.95); --ok-bd: #399961; --ok-tx: #14532d;
    --warn-bg: rgba(255, 243, 230, 0.95); --warn-bd: #d97706; --warn-tx: #7c2d12;
    --crit-bg: rgba(253, 232, 234, 0.95); --crit-bd: #dc2626; --crit-tx: #7f1d1d;
    --wm-opacity: 0.07;
  }
  * { box-sizing: border-box; }
  body {
    font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
    background: var(--bg);
    color: var(--text);
    margin: 0;
    padding: 16px;
    min-height: 100vh;
    position: relative;
    overflow-x: hidden;
    transition: background .2s, color .2s;
  }

  /* Soluk Arka Plan Filigranı (SP2 Türkiye) */
  .bg-watermark {
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  .bg-watermark img {
    width: min(760px, 88vw);
    height: auto;
    opacity: var(--wm-opacity);
    filter: saturate(0.85);
    user-select: none;
    border-radius: 50%;
  }

  .app-shell {
    position: relative;
    z-index: 1;
    max-width: 1320px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  /* Profesyonel Üst Menü (Header) */
  .navbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    padding: 10px 18px;
    background: var(--panel);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid var(--border);
    border-radius: 12px;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.18);
    flex-wrap: wrap;
  }
  .brand-left {
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .sp2-logo-img {
    height: 40px;
    width: auto;
    object-fit: contain;
    filter: drop-shadow(0 2px 6px rgba(0,0,0,0.35));
  }
  .brand-divider {
    width: 1px;
    height: 28px;
    background: var(--border);
  }
  .brand-title-wrap {
    display: flex;
    flex-direction: column;
  }
  .brand-name {
    margin: 0;
    font-size: 16px;
    font-weight: 800;
    letter-spacing: 0.3px;
    color: var(--title);
  }
  .brand-sub {
    font-size: 11px;
    color: var(--muted);
    font-weight: 500;
  }

  .nav-right {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }
  .tools {
    display: flex;
    align-items: center;
    gap: 7px;
    padding: 4px 8px;
    background: var(--input-bg);
    border: 1px solid var(--border);
    border-radius: 9px;
  }
  .color-tool {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 11px;
    color: var(--muted);
    padding: 0 4px;
  }
  .color-tool span { font-weight: 600; }
  input[type="color"] {
    width: 24px;
    height: 24px;
    padding: 1px;
    margin: 0;
    border-radius: 5px;
    border: 1px solid var(--input-border);
    background: transparent;
    cursor: pointer;
  }
  .icon-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 28px;
    height: 28px;
    padding: 0;
    margin: 0;
    border-radius: 6px;
    border: 1px solid var(--input-border);
    background: var(--panel-solid);
    color: var(--text);
    cursor: pointer;
    font-size: 13px;
    transition: border-color .15s, transform .1s;
  }
  .icon-btn:hover { border-color: var(--accent); transform: translateY(-1px); }
  .lang-wrap {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    background: var(--panel-solid);
    border: 1px solid var(--input-border);
    border-radius: 6px;
    padding: 0 6px;
    height: 28px;
  }
  .lang-wrap select {
    margin: 0; padding: 2px; border: 0; background: transparent;
    color: var(--text); font-size: 12px; width: auto; cursor: pointer; outline: none;
  }
  .lang-wrap select option { background: var(--panel-solid); color: var(--text); }

  .exzenor-badge {
    display: flex;
    align-items: center;
    gap: 9px;
    padding: 4px 10px 4px 5px;
    border-radius: 9px;
    background: linear-gradient(135deg, rgba(190, 20, 35, 0.22), rgba(25, 28, 36, 0.6));
    border: 1px solid rgba(220, 45, 60, 0.4);
  }
  .exzenor-logo-img {
    height: 32px;
    width: 32px;
    border-radius: 6px;
    object-fit: cover;
    border: 1px solid rgba(255,255,255,0.2);
  }
  .exzenor-meta { display: flex; flex-direction: column; line-height: 1.15; }
  .exzenor-meta strong { font-size: 12px; letter-spacing: 0.6px; color: var(--text); }
  .exzenor-meta span { font-size: 10px; color: var(--muted); }

  /* Ana Grid & Paneller */
  .grid {
    display: grid;
    grid-template-columns: 365px 1fr;
    gap: 16px;
  }
  .panel {
    background: var(--panel);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.14);
    transition: background .2s, border-color .2s;
  }
  h3 { margin: 14px 0 8px; font-size: 13px; text-transform: uppercase; letter-spacing: 0.5px; color: var(--title); }
  label { display: block; font-size: 12px; color: var(--muted); margin-top: 9px; }
  input, select {
    width: 100%; margin-top: 4px; padding: 7px 9px;
    background: var(--input-bg); color: var(--text);
    border: 1px solid var(--input-border); border-radius: 6px;
    outline: none; transition: border-color .15s;
  }
  input:focus, select:focus { border-color: var(--accent); }
  input[type="checkbox"] { width: auto; margin-right: 6px; vertical-align: middle; }
  .chk { display: flex; align-items: center; margin-top: 10px; font-size: 12px; color: var(--text); cursor: pointer; }
  .row { display: flex; gap: 8px; }
  .row > div { flex: 1; }
  button.btn {
    margin-top: 10px; padding: 9px 12px; border: 0; border-radius: 6px;
    cursor: pointer; font-weight: 600; background: var(--accent); color: #fff;
    width: 100%; transition: opacity .15s, transform .1s;
  }
  button.btn:hover { opacity: 0.92; transform: translateY(-1px); }
  button.btn.sec { background: var(--sec-bg); color: var(--text); }
  button.btn.sec:hover { background: var(--sec-hover); }
  .preview-wrap {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    min-height: 360px; border-radius: 8px; border: 1px dashed var(--border);
    overflow: auto; padding: 14px;
  }
  canvas { image-rendering: pixelated; max-width: 100%; }
  textarea {
    width: 100%; height: 155px; margin-top: 10px;
    background: var(--out-bg); color: var(--out-text);
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px;
    border: 1px solid var(--border); border-radius: 6px; padding: 10px;
  }
  .stats { font-size: 12px; color: var(--title); margin-top: 8px; display: flex; justify-content: space-between; font-weight: 600; }
  .alert { margin-top: 10px; padding: 10px 12px; border-radius: 7px; font-size: 13px; line-height: 1.45; }
  .alert.ok { background: var(--ok-bg); border: 1px solid var(--ok-bd); color: var(--ok-tx); }
  .alert.warn { background: var(--warn-bg); border: 1px solid var(--warn-bd); color: var(--warn-tx); }
  .alert.crit { background: var(--crit-bg); border: 1px solid var(--crit-bd); color: var(--crit-tx); }

  /* Footer / Alt Bilgi Alanı */
  .footer {
    background: var(--panel);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px 18px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    font-size: 12px;
    color: var(--muted);
    line-height: 1.5;
  }
  .footer-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 14px;
    flex-wrap: wrap;
  }
  .footer-disclaimer { flex: 1; min-width: 260px; }
  .footer-disclaimer strong { color: var(--text); }
  .footer-credit {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    text-align: right;
    gap: 2px;
  }
  .footer-credit strong { color: var(--title); font-size: 12.5px; }
  .footer-bottom {
    padding-top: 8px;
    border-top: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 8px;
    font-size: 11px;
  }
  .ai-pill {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 3px 9px;
    border-radius: 999px;
    background: var(--input-bg);
    border: 1px solid var(--border);
    color: var(--text);
    font-weight: 500;
  }

  /* Görsel Yükleme Modalı (Opsiyonel Marka Özelleştirme) */
  .modal-backdrop {
    display: none; position: fixed; inset: 0; z-index: 50;
    background: rgba(0, 0, 0, 0.65); backdrop-filter: blur(4px);
    align-items: center; justify-content: center; padding: 16px;
  }
  .modal-backdrop.open { display: flex; }
  .modal-card {
    background: var(--panel-solid); border: 1px solid var(--border);
    border-radius: 12px; padding: 18px; width: 100%; max-width: 420px;
    box-shadow: 0 16px 40px rgba(0,0,0,0.45);
  }
  .modal-card h3 { margin-top: 0; }

  @media (max-width: 900px) {
    .grid { grid-template-columns: 1fr; }
    .footer-credit { align-items: flex-start; text-align: left; }
  }
</style>
</head>
<body>

<!-- Arka Plan Filigranı: SP2 Türkiye -->
<div class="bg-watermark">
  <img id="wmImg" src="sp2-tr-bg.png" alt="SimplePlanes 2 Türkiye">
</div>

<div class="app-shell">
  <!-- Üst Menü -->
  <header class="navbar">
    <div class="brand-left">
      <img id="sp2LogoImg" class="sp2-logo-img" src="sp2-logo.png" alt="SimplePlanes 2">
      <div class="brand-divider"></div>
      <div class="brand-title-wrap">
        <h1 class="brand-name">RichText Studio</h1>
        <span class="brand-sub" id="brandSub">Creative Label & HUD Image Converter</span>
      </div>
    </div>

    <div class="nav-right">
      <div class="tools">
        <div class="lang-wrap" title="Language">
          <span>🌐</span>
          <select id="langSel" onchange="changeLang(this.value)">
            <option value="en">EN</option>
            <option value="tr">TR</option>
            <option value="ru">RU</option>
            <option value="zh">中文</option>
            <option value="fr">FR</option>
            <option value="de">DE</option>
          </select>
        </div>

        <label class="color-tool" id="lblBtnCol" title="Button / Accent Color" style="margin:0; cursor:pointer;">
          <span id="txtBtnCol">Btn</span>
          <input type="color" id="accentPick" value="#2b7de9" onchange="changeAccent(this.value)">
        </label>

        <label class="color-tool" id="lblTxtCol" title="Text Color" style="margin:0; cursor:pointer;">
          <span id="txtTextCol">Text</span>
          <input type="color" id="textPick" value="#e6eaf2" onchange="changeTextColor(this.value)">
        </label>

        <button class="icon-btn" id="brandBtn" onclick="toggleBrandModal(true)" title="Logo / Watermark Setup">🖼️</button>
        <button class="icon-btn" id="themeBtn" onclick="toggleTheme()" title="Dark / Light Mode">🌙</button>
      </div>

      <div class="exzenor-badge">
        <img id="exzLogoImg" class="exzenor-logo-img" src="exzenor-logo.png" alt="Exzenor">
        <div class="exzenor-meta">
          <strong>EXZENOR</strong>
          <span id="exzSub">SP2 Türkiye</span>
        </div>
      </div>
    </div>
  </header>

  <!-- Ana İçerik -->
  <div class="grid">
    <div class="panel">
      <label id="lblFile" style="margin-top:0;"></label>
      <input type="file" id="f" accept="image/*">
      <button class="btn" id="btnLoad" onclick="loadImg()"></button>

      <div class="row">
        <div>
          <label id="lblImgW"></label>
          <input type="number" id="w" value="48" min="4" max="150">
        </div>
        <div>
          <label id="lblScale"></label>
          <select id="smooth">
            <option value="0" id="optSharp"></option>
            <option value="1" selected id="optSmooth"></option>
          </select>
        </div>
      </div>

      <label class="chk"><input type="checkbox" id="trim" checked> <span id="lblTrim"></span></label>

      <label id="lblMode"></label>
      <select id="mode" onchange="onModeChange()">
        <option value="dot" id="mDot"></option>
        <option value="block" id="mBlock"></option>
        <option value="circle" id="mCircle"></option>
        <option value="square" id="mSquare"></option>
        <option value="ascii_color" id="mAsciiC"></option>
        <option value="ascii_mono" id="mAsciiM"></option>
      </select>

      <div class="row">
        <div>
          <label id="lblCsize"></label>
          <input type="number" id="csize" value="11.2" step="0.05" min="0.5" max="20">
        </div>
        <div>
          <label id="lblTol"></label>
          <input type="number" id="tol" value="12" min="0" max="100">
        </div>
      </div>

      <h3 id="hdrBox"></h3>
      <div class="row">
        <div>
          <label id="lblLW"></label>
          <input type="number" id="lw" value="5" step="0.1" min="0.1">
        </div>
        <div>
          <label id="lblLH"></label>
          <input type="number" id="lh" value="2.5" step="0.1" min="0.1">
        </div>
      </div>

      <div class="row">
        <div>
          <label id="lblBg"></label>
          <select id="bg" onchange="updateBg()">
            <option value="sky" id="bgSky"></option>
            <option value="dark" selected id="bgDark"></option>
            <option value="light" id="bgLight"></option>
            <option value="checker" id="bgCheck"></option>
          </select>
        </div>
        <div>
          <label id="lblZoom"></label>
          <input type="number" id="zoom" value="8" min="2" max="20">
        </div>
      </div>

      <div class="row">
        <button class="btn" id="btnCopySp2" onclick="copyOut(false, this)"></button>
        <button class="btn sec" id="btnCopyXml" onclick="copyOut(true, this)"></button>
      </div>
    </div>

    <div class="panel">
      <h3 id="hdrPrev" style="margin-top:0;"></h3>
      <div id="pwrap" class="preview-wrap" style="background:#15181e;">
        <canvas id="prev"></canvas>
      </div>
      <div id="fitBox" class="alert ok" style="display:none;"></div>
      <div id="perfBox" class="alert warn" style="display:none;"></div>
      <div class="stats">
        <span id="statDim"></span>
        <span id="statLen">0</span>
      </div>
      <textarea id="out" readonly></textarea>
    </div>
  </div>

  <!-- Alt Bilgi / Yasal Uyarı -->
  <footer class="footer">
    <div class="footer-top">
      <div class="footer-disclaimer" id="footerWarn"></div>
      <div class="footer-credit">
        <strong id="footerRole"></strong>
        <span>SimplePlanes 2 Türkiye • EST. 2024</span>
      </div>
    </div>
    <div class="footer-bottom">
      <span class="ai-pill" id="footerAi"></span>
      <span>SP2 RichText Studio</span>
    </div>
  </footer>
</div>

<!-- Marka Görselleri Yükleme Penceresi -->
<div class="modal-backdrop" id="brandModal" onclick="if(event.target===this)toggleBrandModal(false)">
  <div class="modal-card">
    <h3 id="mdlTitle">Brand Images (Saved Locally)</h3>
    <label>SimplePlanes 2 Logo (sp2-logo.png)</label>
    <input type="file" accept="image/*" onchange="saveBrandAsset('sp2_asset_logo', 'sp2LogoImg', this)">
    <label>Exzenor Logo (exzenor-logo.png)</label>
    <input type="file" accept="image/*" onchange="saveBrandAsset('sp2_asset_exz', 'exzLogoImg', this)">
    <label>SP2 Türkiye Watermark (sp2-tr-bg.png)</label>
    <input type="file" accept="image/*" onchange="saveBrandAsset('sp2_asset_wm', 'wmImg', this)">
    <div class="row" style="margin-top:12px;">
      <button class="btn sec" onclick="resetBrandAssets()" id="btnResetAssets">Reset Default</button>
      <button class="btn" onclick="toggleBrandModal(false)" id="btnCloseMdl">OK</button>
    </div>
  </div>
</div>

<canvas id="work" style="display:none"></canvas>
<script>
// Harici PNG dosyaları klasörde yoksa devreye giren yerleşik SVG yedekleri
const FALLBACK_SP2 = 'data:image/svg+xml;utf8,' + encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 96"><polygon points="6,24 314,24 282,42 38,42" fill="#0095ff"/><polygon points="28,46 292,46 274,56 46,56" fill="#e52521"/><polygon points="92,60 228,60 206,82 114,82" fill="#e52521"/><text x="160" y="42" text-anchor="middle" font-family="Arial,sans-serif" font-weight="900" font-style="italic" font-size="25" fill="#ffffff">SimplePlanes</text><text x="160" y="80" text-anchor="middle" font-family="Arial,sans-serif" font-weight="900" font-size="28" fill="#ffffff" stroke="#111" stroke-width="2">2</text></svg>`);
const FALLBACK_EXZ = 'data:image/svg+xml;utf8,' + encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#e11d2e"/><stop offset="100%" stop-color="#6b0710"/></linearGradient></defs><rect width="100" height="100" rx="18" fill="url(#g)"/><circle cx="38" cy="34" r="16" fill="#fff"/><circle cx="43" cy="34" r="13" fill="#b91220"/><polygon points="58,26 60,32 66,32 61,36 63,42 58,38 53,42 55,36 50,32 56,32" fill="#fff"/><text x="50" y="76" text-anchor="middle" font-family="Arial,sans-serif" font-weight="900" font-size="18" fill="#ffffff">EXZENOR</text></svg>`);
const FALLBACK_WM = 'data:image/svg+xml;utf8,' + encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400"><circle cx="200" cy="200" r="175" fill="#a81320" stroke="#e2e8f0" stroke-width="10"/><circle cx="185" cy="200" r="88" fill="#ffffff"/><circle cx="206" cy="200" r="72" fill="#a81320"/><polygon points="278,162 287,188 314,188 292,204 300,230 278,214 256,230 264,204 242,188 269,188" fill="#ffffff"/><text x="200" y="330" text-anchor="middle" font-family="Arial,sans-serif" font-weight="900" font-size="24" fill="#ffffff">SIMPLEPLANES 2</text><text x="200" y="356" text-anchor="middle" font-family="Arial,sans-serif" font-weight="700" font-size="16" fill="#f1f5f9">TÜRKİYE</text></svg>`);

function bindAsset(imgId, storageKey, defaultSrc, fallbackSrc) {
  const el = document.getElementById(imgId);
  el.onerror = function() {
    if (el.src !== fallbackSrc) el.src = fallbackSrc;
  };
  const saved = localStorage.getItem(storageKey);
  el.src = saved || defaultSrc;
}

function saveBrandAsset(storageKey, imgId, input) {
  const file = input.files && input.files[0];
  if (!file) return;
  const r = new FileReader();
  r.onload = ev => {
    try {
      localStorage.setItem(storageKey, ev.target.result);
      document.getElementById(imgId).src = ev.target.result;
    } catch (e) {
      alert('Image too large for browser storage. Place PNG file next to HTML instead.');
    }
  };
  r.readAsDataURL(file);
}

function resetBrandAssets() {
  localStorage.removeItem('sp2_asset_logo');
  localStorage.removeItem('sp2_asset_exz');
  localStorage.removeItem('sp2_asset_wm');
  initAssets();
}

function toggleBrandModal(open) {
  document.getElementById('brandModal').classList.toggle('open', open);
}

function initAssets() {
  bindAsset('sp2LogoImg', 'sp2_asset_logo', 'sp2-logo.png', FALLBACK_SP2);
  bindAsset('exzLogoImg', 'sp2_asset_exz', 'exzenor-logo.png', FALLBACK_EXZ);
  bindAsset('wmImg', 'sp2_asset_wm', 'sp2-tr-bg.png', FALLBACK_WM);
}

const I18N = {
  en: {

let lang = localStorage.getItem('sp2_lang') || 'tr';
if (!I18N[lang]) lang = 'en';
let isLight = localStorage.getItem('sp2_theme') === 'light';
let accent = localStorage.getItem('sp2_accent') || '#2b7de9';
let textColDark = localStorage.getItem('sp2_text_dark') || '#e6eaf2';
let textColLight = localStorage.getItem('sp2_text_light') || '#1b222c';
let loadedImg = null;
const ASCII_RAMP = ' .:-=+*#%@';
const hex2 = n => n.toString(16).padStart(2, '0').toUpperCase();

function applyTheme() {
  document.body.classList.toggle('light', isLight);
  document.getElementById('themeBtn').textContent = isLight ? '☀️' : '🌙';
  document.documentElement.style.setProperty('--accent', accent);
  document.getElementById('accentPick').value = accent;

  const activeText = isLight ? textColLight : textColDark;
  document.documentElement.style.setProperty('--text', activeText);
  document.getElementById('textPick').value = activeText;
}

function toggleTheme() {
  isLight = !isLight;
  localStorage.setItem('sp2_theme', isLight ? 'light' : 'dark');
  applyTheme();
}

function changeAccent(val) {
  accent = val;
  localStorage.setItem('sp2_accent', val);
  applyTheme();
}

function changeTextColor(val) {
  if (isLight) {
    textColLight = val;
    localStorage.setItem('sp2_text_light', val);
  } else {
    textColDark = val;
    localStorage.setItem('sp2_text_dark', val);
  }
  applyTheme();
}

function applyLang() {
  const t = I18N[lang];
  document.getElementById('langSel').value = lang;
  document.getElementById('brandSub').textContent = t.brandSub;
  document.getElementById('txtBtnCol').textContent = t.btnCol;
  document.getElementById('txtTextCol').textContent = t.txtCol;
  document.getElementById('lblFile').textContent = t.file;
  document.getElementById('btnLoad').textContent = t.load;
  document.getElementById('lblImgW').textContent = t.imgW;
  document.getElementById('lblScale').textContent = t.scale;
  document.getElementById('optSharp').textContent = t.sharp;
  document.getElementById('optSmooth').textContent = t.smooth;
  document.getElementById('lblTrim').textContent = t.trim;
  document.getElementById('lblMode').textContent = t.mode;
  document.getElementById('mDot').textContent = t.mDot;
  document.getElementById('mBlock').textContent = t.mBlock;
  document.getElementById('mCircle').textContent = t.mCircle;
  document.getElementById('mSquare').textContent = t.mSquare;
  document.getElementById('mAsciiC').textContent = t.mAsciiC;
  document.getElementById('mAsciiM').textContent = t.mAsciiM;
  document.getElementById('lblCsize').textContent = t.csize;
  document.getElementById('lblTol').textContent = t.tol;
  document.getElementById('hdrBox').textContent = t.hdrBox;
  document.getElementById('lblLW').textContent = t.lw;
  document.getElementById('lblLH').textContent = t.lh;
  document.getElementById('lblBg').textContent = t.bg;
  document.getElementById('bgSky').textContent = t.bgSky;
  document.getElementById('bgDark').textContent = t.bgDark;
  document.getElementById('bgLight').textContent = t.bgLight;
  document.getElementById('bgCheck').textContent = t.bgCheck;
  document.getElementById('lblZoom').textContent = t.zoom;
  document.getElementById('btnCopySp2').textContent = t.copySp2;
  document.getElementById('btnCopyXml').textContent = t.copyXml;
  document.getElementById('hdrPrev').textContent = t.hdrPrev;
  document.getElementById('out').placeholder = t.outPh;
  document.getElementById('footerWarn').innerHTML = t.footerWarn;
  document.getElementById('footerRole').textContent = t.footerRole;
  document.getElementById('footerAi').textContent = t.footerAi;
  if (!loadedImg) {
    document.getElementById('statDim').textContent = t.wait;
    document.getElementById('statLen').textContent = '0 ' + t.chars;
  } else {
    render();
  }
}

function changeLang(l) {
  lang = l;
  localStorage.setItem('sp2_lang', l);
  applyLang();
}

document.getElementById('f').addEventListener('change', loadImg);
['w','smooth','trim','csize','tol','lw','lh','zoom'].forEach(id => {
  document.getElementById(id).addEventListener('input', () => { if (loadedImg) render(); });
  document.getElementById(id).addEventListener('change', () => { if (loadedImg) render(); });
});

function shortColor(r, g, b, a) {
  if (a === 255) {
    const R = hex2(r), G = hex2(g), B = hex2(b);
    if (R[0]===R[1] && G[0]===G[1] && B[0]===B[1]) return '#' + R[0] + G[0] + B[0];
    return '#' + R + G + B;
  }
  return '#' + hex2(r) + hex2(g) + hex2(b) + hex2(a);
}

function onModeChange() {
  const m = document.getElementById('mode').value;
  const sizes = { dot: 11.2, block: 1.75, circle: 3.4, square: 1.9, ascii_color: 1.0, ascii_mono: 1.0 };
  document.getElementById('csize').value = sizes[m];
  if (loadedImg) render();
}

function updateBg() {
  const bg = document.getElementById('bg').value;
  const el = document.getElementById('pwrap');
  if (bg === 'sky') el.style.background = 'linear-gradient(#5ea2e8, #b5d6f5)';
  else if (bg === 'dark') el.style.background = '#15181e';
  else if (bg === 'light') el.style.background = '#d8dce3';
  else el.style.background = 'repeating-conic-gradient(#444 0% 25%, #2b2b2b 0% 50%) 50% / 16px 16px';
}

function loadImg() {
  const t = I18N[lang];
  const file = document.getElementById('f').files[0];
  if (!file) { document.getElementById('statDim').textContent = t.pickFirst; return; }
  document.getElementById('statDim').textContent = t.loading;
  const reader = new FileReader();
  reader.onload = function(ev) {
    const img = new Image();
    img.onload = function() { loadedImg = img; render(); };
    img.onerror = function() { document.getElementById('statDim').textContent = t.errRead; };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
}

function render() {
  try {
    if (!loadedImg) return;
    const tr = I18N[lang];
    const rawW = Math.max(4, Math.min(150, parseInt(document.getElementById('w').value, 10) || 48));
    const rawH = Math.max(1, Math.round(loadedImg.height * (rawW / loadedImg.width)));
    const mode = document.getElementById('mode').value;
    const csize = parseFloat(document.getElementById('csize').value) || 1;
    const tol = parseInt(document.getElementById('tol').value, 10) || 0;
    const zoom = parseInt(document.getElementById('zoom').value, 10) || 8;
    const smooth = document.getElementById('smooth').value === '1';
    const doTrim = document.getElementById('trim').checked;
    const lw = parseFloat(document.getElementById('lw').value) || 5;
    const lh = parseFloat(document.getElementById('lh').value) || 2.5;

    const work = document.getElementById('work'), wctx = work.getContext('2d');
    work.width = rawW; work.height = rawH;
    wctx.imageSmoothingEnabled = smooth;
    wctx.clearRect(0, 0, rawW, rawH);
    wctx.drawImage(loadedImg, 0, 0, rawW, rawH);
    const d = wctx.getImageData(0, 0, rawW, rawH).data;

    let minX = rawW, maxX = -1, minY = rawH, maxY = -1;
    for (let y = 0; y < rawH; y++) {
      for (let x = 0; x < rawW; x++) {
        if (d[(y * rawW + x) * 4 + 3] >= 10) {
          if (x < minX) minX = x;
          if (x > maxX) maxX = x;
          if (y < minY) minY = y;
          if (y > maxY) maxY = y;
        }
      }
    }

    if (maxX === -1) {
      document.getElementById('statDim').textContent = tr.emptyImg;
      return;
    }

    const startX = doTrim ? minX : 0;
    const startY = doTrim ? minY : 0;
    const endX = doTrim ? maxX : rawW - 1;
    const endY = doTrim ? maxY : rawH - 1;
    const W = endX - startX + 1;
    const H = endY - startY + 1;
    const usedW = maxX - startX + 1;
    const usedH = maxY - startY + 1;

    const prev = document.getElementById('prev'), pctx = prev.getContext('2d');
    prev.width = W * zoom; prev.height = H * zoom;
    pctx.clearRect(0, 0, prev.width, prev.height);
    if (mode.startsWith('ascii')) {
      pctx.font = 'bold ' + zoom + 'px monospace';
      pctx.textAlign = 'center';
      pctx.textBaseline = 'middle';
    }

    let res = '<align=left><mspace=1.em><line-height=1.em>';
    if (csize !== 1) res += '<size=' + csize + 'em>';
    let lastCol = '', lr = -999, lg = -999, lb = -999, la = -999;

    for (let y = startY; y <= endY; y++) {
      let row = [], lastNonEmpty = -1;
      for (let x = startX; x <= endX; x++) {
        const i = (y * rawW + x) * 4;
        let r = d[i], g = d[i+1], b = d[i+2], a = d[i+3];
        if (a < 10) { row.push(null); continue; }
        if (tol > 0 && Math.abs(r-lr)+Math.abs(g-lg)+Math.abs(b-lb)+Math.abs(a-la) <= tol) {
          r = lr; g = lg; b = lb; a = la;
        } else { lr = r; lg = g; lb = b; la = a; }
        const lum = (0.299*r + 0.587*g + 0.114*b) / 255;
        const ach = ASCII_RAMP[Math.min(ASCII_RAMP.length - 1, Math.floor(lum * ASCII_RAMP.length))];
        row.push({ r, g, b, a, col: shortColor(r, g, b, a), ach });
        lastNonEmpty = x - startX;
      }

      if (lastNonEmpty === -1) { if (y < endY) res += '<br>'; continue; }
      let x = 0, spaces = 0;
      while (x <= lastNonEmpty && row[x] === null) { spaces++; x++; }
      if (spaces > 0) res += (csize !== 1) ? '<space=' + (spaces / csize).toFixed(6) + 'em>' : '<space=' + spaces + 'em>';

      for (; x <= lastNonEmpty; x++) {
        const p = row[x];
        if (!p) { res += ' '; continue; }

        pctx.fillStyle = mode === 'ascii_mono' ? 'rgba(220,235,255,' + (p.a/255) + ')' : 'rgba(' + p.r + ',' + p.g + ',' + p.b + ',' + (p.a/255) + ')';
        const px = x * zoom, py = (y - startY) * zoom;
        if (mode === 'dot') {
          pctx.beginPath(); pctx.arc(px + zoom/2, py + zoom/2, zoom * 0.62, 0, Math.PI * 2); pctx.fill();
        } else if (mode === 'circle') {
          pctx.beginPath(); pctx.arc(px + zoom/2, py + zoom/2, zoom * 0.44, 0, Math.PI * 2); pctx.fill();
        } else if (mode === 'square') {
          pctx.fillRect(px + zoom*0.08, py + zoom*0.08, zoom*0.84, zoom*0.84);
        } else if (mode === 'block') {
          pctx.fillRect(px, py, zoom, zoom);
        } else {
          pctx.fillText(p.ach, px + zoom/2, py + zoom/2);
        }

        let ch = '.';
        if (mode === 'circle') ch = '•';
        else if (mode === 'square') ch = '■';
        else if (mode === 'block') ch = '█';
        else if (mode.startsWith('ascii')) ch = p.ach;

        if (mode !== 'ascii_mono' && p.col !== lastCol) {
          res += '<' + p.col + '>'; lastCol = p.col;
        }
        res += ch;
      }
      if (y < endY) res += '<br>';
    }

    const t = mode === 'dot' ? 1 : Math.max(0, Math.min(1, (csize - 1.05) / (10.5 - 1.05)));
    const stepH = 0.10 + 0.05 * t;
    const padH = 0.5 + 5.5 * t;
    const capW = Math.max(0, Math.floor((10 * lw) - 1));
    const capH = Math.max(0, Math.floor((lh / stepH) - padH));
    const reqW = Math.ceil(((usedW + 1) / 10) * 100) / 100;
    const reqH = Math.ceil(((usedH + padH) * stepH) * 100) / 100;

    const fitBox = document.getElementById('fitBox');
    fitBox.style.display = 'block';
    if (usedW <= capW && usedH <= capH) {
      fitBox.className = 'alert ok';
      fitBox.innerHTML = tr.fitOk(capW, capH, usedW, usedH);
    } else {
      fitBox.className = 'alert warn';
      fitBox.innerHTML = tr.fitNo(lw, lh, capW, capH, usedW, usedH, reqW, reqH);
    }

    const len = res.length;
    const perfBox = document.getElementById('perfBox');
    if (len > 200000) {
      perfBox.style.display = 'block';
      perfBox.className = 'alert crit';
      perfBox.innerHTML = '🔥 ' + tr.p200;
    } else if (len > 100000) {
      perfBox.style.display = 'block';
      perfBox.className = 'alert crit';
      perfBox.innerHTML = '⚠️ ' + tr.p100;
    } else if (len >= 20000) {
      perfBox.style.display = 'block';
      perfBox.className = 'alert warn';
      perfBox.innerHTML = '🥔 ' + tr.p20;
    } else {
      perfBox.style.display = 'none';
    }

    document.getElementById('out').value = res;
    document.getElementById('statDim').textContent = `${tr.dim}: ${usedW} × ${usedH} px (${tr.raw}: ${rawW} × ${rawH})`;
    document.getElementById('statLen').textContent = `${len.toLocaleString()} ${tr.chars}`;
  } catch (err) {
    document.getElementById('statDim').textContent = 'Error: ' + err.message;
  }
}

function copyOut(asXml, btn) {
  let txt = document.getElementById('out').value;
  if (!txt) return;
  if (asXml) txt = txt.replace(/</g, '&lt;').replace(/>/g, '&gt;');
  navigator.clipboard.writeText(txt);
  const old = btn.textContent;
  btn.textContent = I18N[lang].copied;
  setTimeout(() => { btn.textContent = old; }, 1000);
}

initAssets();
applyTheme();
applyLang();
</script>
